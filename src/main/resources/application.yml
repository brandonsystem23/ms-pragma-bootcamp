server:
  port: 8084

spring:
  application:
    name: bootcamp_service
  r2dbc:
    url: ${R2DBC_URL:r2dbc:mysql://localhost:3306/pragma}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: ${JWT_SECRET:PragmaJwtSecret_2026_fK2mQ9xL7vN4pR6tY3wZ1aB5cD8eF0gH}

clients:
  capability:
    base-url: ${USERS_SERVICE_URL:http://localhost:8083}
    path: /api/v1/capability/exists-by-ids
    by-ids-path: /api/v1/capability/by-ids


logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.springframework.r2dbc: DEBUG
    # Actualizado al paquete del driver io.asyncer
    io.asyncer.r2dbc.mysql: INFO

